name: Publish Apex website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static website
        env:
          SITE_URL: https://${{ steps.pages.outputs.host }}${{ steps.pages.outputs.base_path }}/
        run: node scripts/build.mjs
      - name: Check content, links and SEO
        env:
          SITE_URL: https://${{ steps.pages.outputs.host }}${{ steps.pages.outputs.base_path }}/
        run: node scripts/check.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
